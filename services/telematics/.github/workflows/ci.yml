name: CI - Sprint 6

on:
  push:
    branches: [ dev, feature/** ]
  pull_request:
    branches: [ dev ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://test:test@localhost:5432/test_db

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        run: |
          PYTHONPATH=$PYTHONPATH:. pytest tests/ --disable-warnings --maxfail=3 -v

      - name: Run Ruff Lint
        run: |
          pip install ruff
          ruff .

      - name: Run Tests with Coverage
        run: |
          pip install pytest-cov
          pytest --cov=app tests/ --disable-warnings --maxfail=3 -v