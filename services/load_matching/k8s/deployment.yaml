apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-matching
  labels:
    app: load-matching
spec:
  replicas: 3
  selector:
    matchLabels:
      app: load-matching
  template:
    metadata:
      labels:
        app: load-matching
    spec:
      containers:
      - name: load-matching
        image: tamp-load-matching:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8003
        - containerPort: 9090
        env:
        - name: MATCH_SERVICE_HOST
          value: "0.0.0.0"
        - name: MATCH_SERVICE_PORT
          value: "8003"
        - name: MATCH_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: load-matching-secrets
              key: jwt-secret
        - name: MATCH_VEHICLE_SVC_URL
          value: "http://vehicle-service:8001"
        - name: MATCH_TELEMATICS_URL
          value: "http://telematics-service:8002"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8003
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: load-matching
spec:
  selector:
    app: load-matching
  ports:
  - name: http
    port: 8003
    targetPort: 8003
  - name: metrics
    port: 9090
    targetPort: 9090
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: load-matching
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
  - host: api.example.com
    http:
      paths:
      - path: /match
        pathType: Prefix
        backend:
          service:
            name: load-matching
            port:
              number: 8003
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: load-matching
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: load-matching
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80 