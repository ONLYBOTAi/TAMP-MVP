apiVersion: v1
kind: ServiceAccount
metadata:
  name: load-matching
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: load-matching
  namespace: default
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: load-matching
  namespace: default
subjects:
- kind: ServiceAccount
  name: load-matching
  namespace: default
roleRef:
  kind: Role
  name: load-matching
  apiGroup: rbac.authorization.k8s.io 