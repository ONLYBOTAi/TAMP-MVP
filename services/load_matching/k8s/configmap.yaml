apiVersion: v1
kind: ConfigMap
metadata:
  name: load-matching-config
data:
  MATCHING_THRESHOLD: "0.8"
  RATE_LIMIT: "100"
  RATE_LIMIT_PERIOD: "60"
  CACHE_TTL: "300"
  LOG_LEVEL: "INFO"
  METRICS_ENABLED: "true"
  VEHICLE_SERVICE_TIMEOUT: "5"
  TELEMATICS_SERVICE_TIMEOUT: "5"
  REDIS_HOST: "redis-master"
  REDIS_PORT: "6379"
  PROMETHEUS_METRICS_PATH: "/metrics"
  PROMETHEUS_METRICS_PORT: "9090" 