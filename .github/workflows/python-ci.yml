name: Python CI

on:
  push:
    branches: [ dev, feature/* ]
    paths-ignore:
      - 'services/*/.env.example'
  pull_request:
    branches: [ dev ]
    paths-ignore:
      - 'services/*/.env.example'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install system build deps
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          python3-dev \
          libpq-dev

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        for svc in auth vehicle telematics load_matching matcher trailer; do
          pip install --no-cache-dir -r services/$svc/requirements.txt
        done
        
    - name: Prepare service envs for tests
      run: |
        for svc in auth vehicle telematics load_matching matcher trailer; do
          cp services/$svc/.env.example services/$svc/.env
        done
    - name: Run tests
      run: |
        cd services/telematics
        PYTHONPATH=$PYTHONPATH:. pytest tests/integration/ -v
        
    - name: Run linting
      run: |
        cd services/telematics
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics 