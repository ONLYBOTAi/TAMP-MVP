name: CI - Sprint 9

on:
  push:
    branches: [ dev, feature/** ]
    paths-ignore:
      - 'services/*/.env.example'
  pull_request:
    branches: [ dev ]
    paths-ignore:
      - 'services/*/.env.example'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://test:test@localhost:5432/test_db

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Debug Python include path
        run: |
          python3 -c "import sysconfig; print(sysconfig.get_paths()['include'])"
          ls -l $(python3 -c "import sysconfig; print(sysconfig.get_paths()['include'])")/longintrepr.h || echo "HEADER NOT FOUND"

      - name: Install system build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            python3.11-dev \
            libpq-dev

      - name: Install dependencies (per-service, Sprint 9)
        run: |
          python -m pip install --upgrade pip
          for svc in auth vehicle telematics load_matching matcher trailer; do
            pip install --no-cache-dir -r services/$svc/requirements.txt
          done

      - name: Run Pytest
        run: |
          PYTHONPATH=$PYTHONPATH:. pytest tests/ --disable-warnings --maxfail=3 -v

      - name: Run Ruff Lint
        run: |
          pip install ruff
          ruff .

      - name: Run Tests with Coverage
        run: |
          pip install pytest-cov
          pytest --cov=app tests/ --disable-warnings --maxfail=3 -v 