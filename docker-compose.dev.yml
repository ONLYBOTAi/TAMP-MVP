services:
  tamp_auth_svc:
    build: ./services/auth
    container_name: tamp_auth_svc
    ports:
      - "8000:8000"
    env_file:
      - ./services/auth/.env
    volumes:
      - ./services/auth:/app
    networks:
      - tamp_network

  tamp_vehicle_svc:
    build: ./services/vehicle
    container_name: tamp_vehicle_svc
    ports:
      - "8001:8001"
    env_file:
      - ./services/vehicle/.env
    depends_on:
      - tamp_auth_svc
    volumes:
      - ./services/vehicle:/app
    networks:
      - tamp_network

networks:
  tamp_network:
    driver: bridge 